{% extends "base.html" %}

{% block title %}Nouveau produit{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header">
        <h1 class="h4 mb-0">Nouveau produit</h1>
    </div>
    <div class="card-body">
        <form action="{{ url_for('produit.create') }}" method="POST">
            <div class="mb-3">
                <label for="nom" class="form-label">Nom *</label>
                <input type="text" class="form-control" id="nom" name="nom" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label for="prix" class="form-label">Prix *</label>
                <input type="number" class="form-control" id="prix" name="prix" step="0.01" min="0" value="0" required>
            </div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a href="{{ url_for('produit.index') }}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
